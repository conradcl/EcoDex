<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoDex Gallery</title>
    <link rel="stylesheet" href="style.css" />
    <script src="gallery.js" defer></script>
  </head>
  <body>
    <img src="/images/border-top-gallery.png" alt="Top Banner" class="static-top">
    
    <div id="galleryContainer" class="gallery-container"></div>

    <div class="button-row">
      <button id="backButtonGallery" class="image-button" aria-label="Back to Home">
        <img
          src="/images/back-button.png"
          alt="Back to Home"
          data-default-src="/images/back-button.png"
          data-pressed-src="/images/back-button-pressed.png"
        />
      </button>
    
      <button id="clearGalleryButton">Clear Gallery</button>
    </div>
    
    <img src="/images/border-bottom.png" alt="Bottom Banner" class="static-bottom">
  </body>
</html>
