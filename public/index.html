<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoDex Home</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <h1>EcoDex</h1>

    <div class="controls-grid">
      <div class="left-controls">
        <button id="startCameraButton" class="big-square">Start Camera</button>
    
        <label for="imageUploader" class="upload-button wide">Upload Photo</label>
        <input type="file" id="imageUploader" accept="image/*" />
      </div>
    
      <div class="right-controls">
        <button id="viewGalleryButton" class="image-button" aria-label="View My Sightings">
          <img
            src="/images/gallery-button.png"
            alt="View My Sightings"
            data-default-src="/images/gallery-button.png"
            data-pressed-src="/images/gallery-button-pressed.png"
          />
        </button>
    
        <button id="updateLocationButton" class="image-button" aria-label="Update Location">
          <img
            src="/images/location-button.png"
            alt="Update Location"
            data-default-src="/images/location-button.png"
            data-pressed-src="/images/location-button-pressed.png"
          />
        </button>
      </div>
    </div>

    <div id="cameraView" class="camera-view hidden">
      <video id="videoFeed" autoplay playsinline></video>
      <button id="takePictureButton">Take Picture</button>
    </div>

    <canvas id="imageCanvas" class="hidden"></canvas>
  </body>
</html>
