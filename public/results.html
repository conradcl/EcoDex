<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoDex Results</title>
    <link rel="stylesheet" href="style.css" />
    <script src="results.js" defer></script>
  </head>
  <body>

    <div id="loader"> <p>LOADING...</p>
    </div>

    <div id="resultsSection" class="hidden"> <img id="previewImage" alt="Your Image" />
      <h2 id="commonName"></h2>
      <p><em>(<span id="speciesName"></span>)</em></p>
      <div id="statusTag"></div>
      <p id="description"></p>

    </div>

    <button id="backButton" class="image-button" aria-label="Back to Home">
      <img
          src="/images/back-button.png"
          alt="Back to Home"
          data-default-src="/images/back-button.png"
          data-pressed-src="/images/back-button-pressed.png"
      />
    </button>
    
  </body>
</html>
